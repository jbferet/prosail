image: rocker/geospatial:4.5

# gitlab-ci file inspired from https://www.r-bloggers.com/developing-r-packages-with-usethis-and-gitlab-ci-part-iii/

variables:
  R_LIBS_DIR: "$CI_PROJECT_DIR/ci/lib"
  CHECK_DIR: "$CI_PROJECT_DIR/ci/logs"
  BUILD_LOGS_DIR: "$CI_PROJECT_DIR/ci/logs/$CI_PROJECT_NAME.Rcheck"

cache:
  paths:
  - $R_LIBS_DIR

before_script:
  - export R_LIBS_USER=$R_LIBS_DIR/$(R --version | sed -n 1p| sed -r 's/.*([0-9]\.[0-9]\.[0-9]).*/\1/')
  - echo $R_LIBS_USER
  - mkdir -p $R_LIBS_USER $BUILD_LOGS_DIR
  - ls $R_LIBS_DIR
  # delete other R version libs
  - find $R_LIBS_DIR/* -maxdepth 0 ! -name $(basename $R_LIBS_USER) -type d -exec rm -r {} +
  - ls $R_LIBS_DIR
  - echo '.libPaths("'${R_LIBS_USER}'")' > .Rprofile
  - apt-get update && apt-get install -y qpdf
  # pandoc git libcurl4-openssl-dev libgit2-dev libudunits2-dev libnetcdf-dev libproj-dev libgeos-dev libgdal-dev netcdf-bin libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev
  # - apt-get install -y qpdf pandoc git libcurl4-openssl-dev libgit2-dev libudunits2-dev libnetcdf-dev libproj-dev libgeos-dev libgdal-dev netcdf-bin gdal-bin aria2 libpython2-dev libjq-dev libprotobuf-dev protobuf-compiler libv8-dev libssl-dev libcairo2-dev

stages:
  - deps
  - check
  - deploy

deps:
  stage: deps
  script:
  - R -e 'install.packages("remotes", type = "source")'
  - R -e 'remotes::install_cran("liquidSVM", repos="http://pnp.mathematik.uni-stuttgart.de/isa/steinwart/software/R", build_opts="--no-multiarch")'
  - R -e 'remotes::install_deps(dependencies=T)'
  only:
    - master
    - schedules

check:
  stage: check
  script:
  - R -e 'install.packages("remotes", type = "source")'
  - R -e "remotes::install_cran(c('systemfonts', 'textshaping'))"
  - R -e 'devtools::check(check_dir = Sys.getenv("CHECK_DIR"), error_on = "error")'
  - R -e 'devtools::install()'
  only:
    - master
    - schedules

pages:
  stage: deploy
  script:
  - R -e 'devtools::install_github("r-lib/pkgdown", upgrade="never")' # GITHUB_PAT necessary
  - R -e 'devtools::document()'
  - R -e 'pkgdown::build_site()'
  # - grep gitlab docs/reference/PRO4SAIL.html
  - mv docs public
  artifacts:
    paths:
    - public

  only:
  - master

zenodo:
  stage: deploy
  image: python:3.7
  rules:
  - if: $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+/
  variables:
    GIT_STRATEGY: clone
    VERSION: $CI_COMMIT_TAG
  script:
    - git fetch --all
    - echo $(git tag)
    - pip install git+https://gitlab.com/sbeniamine/gitlab2zenodo
    - git archive --format zip --worktree-attributes --prefix ${CI_PROJECT_TITLE}-${VERSION}/ --output ${CI_PROJECT_TITLE}-${VERSION}.zip ${VERSION}
    - unzip -l ${CI_PROJECT_TITLE}-${VERSION}.zip
    - g2z-get-meta -i $zenodo_record -o .zenodo.json
    - vdate=$(git log -1 --format=%cd --date=short ${VERSION}) && sed -i "s/[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}/${vdate}/g" .zenodo.json
    - cat .zenodo.json
    - g2z-send -t $zenodo_token -m .zenodo.json -v ${VERSION} ${CI_PROJECT_TITLE}-${VERSION}.zip
